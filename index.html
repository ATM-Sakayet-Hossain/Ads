<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CocaCola Animation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="ppm_container" id="ppm_container">
      <img
        src="https://ms.purplepatch.online/assets/close/close_red.png"
        class="ppm_closeBtn_takeover"
        alt="Close"
        onclick="closePopup()"
      />
      <div class="ppm_container_inner">
        <img class="product-cap" src="/image/cap.png" alt="Cap" />
        <img class="product-ball" src="/image/1.png" alt="Ball" />
        <div class="gift-box">
          <div class="box-body">
            <img
              class="product-item product-cola"
              src="/image/cola.png"
              alt="Coca-Cola"
            />
            <img
              class="product-item product-fridge"
              src="/image/fridge.png"
              alt="Fridge"
            />
            <img class="product-item product-tv" src="/image/tv.png" alt="TV" />
            <img
              class="product-item product-mobile"
              src="/image/mobile.png"
              alt="Mobile"
            />
            <img
              class="product-item product-copy"
              src="/image/copy.png"
              alt="Copy"
            />
            <div class="box-lid">
              <div class="box-bowtie"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
