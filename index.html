<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CocaCola Animation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="ppm_container" id="ppm_container">
      <div class="ppm_header">
        <a
          href="https://boostrava.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img class="ppm_logo" src="/image/logo.png" alt="Logo"
        /></a>
        <button
          class="ppm_closeBtn_takeover"
          aria-label="Close"
          onclick="closePopup()"
        >
          X
        </button>
      </div>
      <div class="ppm_container_inner">
        <img class="product-cap" src="/image/Tea-Shop-Logo.png" alt="Cap" />
        <img class="product-ball" src="/image/1.png" alt="Ball" />
        <div class="gift-box">
          <div class="box-body">
            <img
              class="product-item tea-shop"
              src="/image/copy.png"
              alt="Copy"
            />
              <p>সাথে প্রথম অর্ডারে ডিস্কাউন্ড</p>
            <div class="viewport-box">
              <div class="main-circle"></div>
            </div>
            <div class="box-lid">
              <div class="box-bowtie"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
